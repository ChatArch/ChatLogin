<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LoginUI 模板游乐场</title><link rel="stylesheet" href="/assets/demo.css"><script defer src="/assets/demo.js"></script></head>
<body class="templates-page"><header class="lab-header"><a class="brand" href="/"><span>CL</span> ChatLogin</a><p>ACTUAL LOGINUI PLAYGROUND</p></header>
<main class="playground" data-playground><section class="playground__controls"><p class="eyebrow">3 × 2 × 3</p><h1>选择适合你网站的登录页。</h1><p>预览由实际 <code>LoginUI.render()</code> 生成；控件只修改有限的公开选项。</p>
<label>色系<select name="palette"><option>indigo</option><option>forest</option><option>amber</option></select></label><label>布局<select name="layout"><option>card</option><option>split</option></select></label><label>外观<select name="appearance"><option>system</option><option>light</option><option>dark</option></select></label><label class="check"><input name="guest" type="checkbox"> 显示访客入口</label>
<pre><code data-config>LoginUI()</code></pre><button class="button" type="button" data-copy>复制配置</button><p class="copy-status" role="status"></p></section>
<section class="playground__preview"><iframe title="LoginUI 实时预览" src="/playground/preview"></iframe></section></main></body></html>
