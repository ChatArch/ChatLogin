<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Headless · AsyncCallbackBackend</title><link rel="stylesheet" href="/assets/demo.css"><link rel="stylesheet" href="/assets/demo-login.css"><script defer src="/assets/demo.js"></script><script defer src="/assets/demo-login.js"></script></head>
<body class="lab-page"><header class="lab-header"><a class="brand" href="/"><span>CL</span> ChatLogin</a><p>HEADLESS / ASYNC CALLBACK</p></header>
<main class="headless-shell"><section><p class="eyebrow">HOST-OWNED HTML + JSON API</p><h1>保留页面，接入异步认证</h1><p>这是本地合成的 <code>AsyncCallbackBackend</code>；没有远程服务或客户数据库。</p>
<div class="sequence"><span>01 bootstrap</span><span>02 session</span><span>03 login</span><span>04 CSRF action</span><span>05 logout</span></div></section>
<section class="headless-login" id="headless-login" data-mode="async" data-return="/workspace/async"><p class="chip">PUBLIC DEMO · 无业务权限</p><h2>Headless 登录</h2>
<form><label>账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label>
<div class="form-actions"><button class="button primary" type="submit">登录</button></div><p class="form-status" role="status"></p></form>
<p class="safe-note">A/B均为公开合成用户。登录后可验证各自数据与越权拒绝；同一浏览器标签共享当前登录身份。</p><a href="/guest?mode=async">以访客身份查看工作区</a></section></main></body></html>
