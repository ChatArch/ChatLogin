name: Web Compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/chatlogin/fastapi.py"
      - "src/chatlogin/ui.py"
      - "src/chatlogin/web/**"
      - "tests/code-tests/test_web.py"
      - "tests/code-tests/test_ui_contract.py"
      - "pyproject.toml"
      - ".github/workflows/web-compatibility.yml"

jobs:
  fastapi-starlette:
    name: Python ${{ matrix.python }} / ${{ matrix.starlette-line }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            starlette-line: "0.x"
            fastapi: "fastapi>=0.110,<1.0"
            starlette: "starlette>=0.40,<1.0"
          - python: "3.10"
            starlette-line: "1.3.x"
            fastapi: "fastapi==0.133.*"
            starlette: "starlette>=1.3,<1.4"
          - python: "3.11"
            starlette-line: "0.x"
            fastapi: "fastapi>=0.110,<1.0"
            starlette: "starlette>=0.40,<1.0"
          - python: "3.11"
            starlette-line: "1.3.x"
            fastapi: "fastapi==0.133.*"
            starlette: "starlette>=1.3,<1.4"
          - python: "3.12"
            starlette-line: "0.x"
            fastapi: "fastapi>=0.110,<1.0"
            starlette: "starlette>=0.40,<1.0"
          - python: "3.12"
            starlette-line: "1.3.x"
            fastapi: "fastapi==0.133.*"
            starlette: "starlette>=1.3,<1.4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[web]" pytest "httpx>=0.27,<1.0" "${{ matrix.fastapi }}" "${{ matrix.starlette }}"
      - run: python -m pytest -q tests/code-tests/test_web.py tests/code-tests/test_ui_contract.py
