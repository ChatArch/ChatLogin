name: Frontend Package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-client:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/chatlogin/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[web]'
      - run: npm ci --ignore-scripts
        working-directory: packages/chatlogin
      - name: React 18 consumer compatibility
        if: matrix.react == '18'
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund react@18.3.1 react-dom@18.3.1 react-test-renderer@18.3.1 @types/react@18 @types/react-dom@18
        working-directory: packages/chatlogin
      - run: python packages/chatlogin/scripts/http_contract.py --check
      - run: npm run check:shared
        working-directory: packages/chatlogin
      - run: npm test
        working-directory: packages/chatlogin
      - run: npm run typecheck
        working-directory: packages/chatlogin
      - run: npm run pack:check
        working-directory: packages/chatlogin
      - name: Confirm generated resources did not drift
        run: git diff --exit-code -- src/chatlogin/web/assets packages/chatlogin/styles packages/chatlogin/LICENSE
