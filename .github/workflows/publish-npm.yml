name: Publish npm Package

on:
  push:
    tags: ['npm-v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'
          cache: npm
          cache-dependency-path: packages/chatlogin/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check merged tag and exact package version
        id: meta
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          const p = JSON.parse(readFileSync('packages/chatlogin/package.json', 'utf8'));
          if (p.name !== '@chatarch/chatlogin' || p.private ||
              process.env.GITHUB_REF_NAME !== `npm-v${p.version}`) {
            throw new Error('Tag must match the public ChatLogin npm package version');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${p.version}\n`);
          JS
      - name: Use npm with native OIDC support
        run: npm install --global npm@11
      - run: python -m pip install '.[dev]'
      - run: npm ci --ignore-scripts
        working-directory: packages/chatlogin
      - run: python packages/chatlogin/scripts/http_contract.py --check
      - run: npm run check:shared && npm test && npm run typecheck && npm run pack:check
        working-directory: packages/chatlogin
      - name: Confirm generated resources did not drift
        run: git diff --exit-code -- src/chatlogin/web/assets packages/chatlogin/styles packages/chatlogin/LICENSE
      - name: Check registry version
        id: registry
        run: |
          node --input-type=module <<'JS'
          import {readFileSync, appendFileSync} from 'node:fs';
          const p = JSON.parse(readFileSync('packages/chatlogin/package.json', 'utf8'));
          const url = `https://registry.npmjs.org/${encodeURIComponent(p.name)}/${p.version}`;
          const response = await fetch(url, {signal: AbortSignal.timeout(15000)});
          if (![200, 404].includes(response.status)) {
            throw new Error(`Cannot verify npm release: ${response.status}`);
          }
          if (response.status === 200) {
            const published = await response.json();
            if (published.name !== p.name || published.version !== p.version) {
              throw new Error('Registry package identity mismatch');
            }
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `exists=${response.status === 200}\n`);
          JS
      - name: Publish through npm Trusted Publishing
        if: steps.registry.outputs.exists == 'false'
        run: npm publish --access public --provenance --registry https://registry.npmjs.org/
        working-directory: packages/chatlogin
      - name: Verify registry release
        env:
          PACKAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: npm view "@chatarch/chatlogin@${PACKAGE_VERSION}" name version dist.integrity --json --registry https://registry.npmjs.org/
