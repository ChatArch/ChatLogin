[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ChatLogin"
dynamic = ["version"]
description = "Reusable authentication, sessions, and login templates for Python-backed websites."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["click>=8.0,<9.0", "chatstyle>=0.2.0,<0.3.0", "chatenv>=0.2.11,<0.3.0"]
authors = [{name = "ChatArch", email = "1073853456@qq.com"}]
keywords = ["chatlogin", "chatarch", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/ChatArch/ChatLogin"
Repository = "https://github.com/ChatArch/ChatLogin"
Documentation = "https://arch.gh.wzhecnu.cn/ChatLogin/"

[project.scripts]
chatlogin = "chatlogin.cli:main"

[project.entry-points."chatenv.configs"]
chatlogin = "chatlogin.config"

[project.optional-dependencies]
ui = ["jinja2>=3.1,<4.0"]
web = ["fastapi>=0.110.0,<1.0", "starlette>=0.40,<2.0", "jinja2>=3.1,<4.0"]
demo = ["fastapi>=0.110.0,<1.0", "starlette>=0.40,<2.0", "jinja2>=3.1,<4.0", "uvicorn>=0.27,<1.0"]
dev = ["build", "pytest", "twine", "uvicorn>=0.27,<1.0", "fastapi>=0.110.0,<1.0", "starlette>=0.40,<2.0", "jinja2>=3.1,<4.0", "httpx>=0.27,<1.0", "tomli>=2.0,<3.0; python_version<\"3.11\""]
docs = ["mkdocs>=1.6,<2.0", "mkdocs-material>=9.5,<9.7", "mkdocs-static-i18n>=1.2,<2.0", "mike>=2.0,<3.0"]

[tool.setuptools.dynamic]
version = {attr = "chatlogin.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"chatlogin.web" = ["templates/chatlogin/*.html", "assets/*"]
"chatlogin.demo_site" = ["templates/*.html", "assets/*"]
